<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=5.0">

    <title>CSS Styling Examples</title>

    <!-- Internal CSS -->

    <style>
        h2 {

            color: green;

        }
    </style>
    <!-- External CSS -->
    
    <link rel="stylesheet" href="style.css">



</head>

<body>

    <hr>

    <!-- Inline CSS -->

    <h1 style="color: red;">this is so cool</h1>

    <!-- Internal CSS -->

    <h1>wow!</h1>



    <hr>

    <!-- element selector example -->

    <h4>ELEMENT SELECTOR EXAMPLE</h4>

    <h4>ELEMENT SELECTOR EXAMPLE</h4>

    <hr>

    <!-- class and id selector example -->

    <h2 class="myclass">CLASS SELECTOR EXAMPLE</h2>

    <h2 id="myid">ID SELECTOR </h2>

    <h2 class="myclass">CLASS SELECTOR </h2>

    <hr>

    <!-- group selector example -->

    <h5> EXAMPLE 4</h5>

    <p> EXAMPLE 3</p>

    <hr>

</body>

</html>
